# Prometheus scrape configuration for ReturnIQ Enterprise
# Mount this file into the Prometheus container

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: returniq
    env: production

# Alerting rules file
rule_files:
  - "alert_rules.yml"

# Alertmanager (optional — configure if you have one)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:

  # ReturnIQ backend metrics (FastAPI + prometheus-fastapi-instrumentator)
  - job_name: returniq_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Postgres exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Redis exporter
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  # Nginx exporter
  - job_name: nginx
    static_configs:
      - targets: ["nginx_exporter:9113"]

  # Node/system metrics (host)
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
