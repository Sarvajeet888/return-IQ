# ReturnIQ — Prometheus Alert Rules

groups:
  - name: returniq_api
    rules:

      # API is completely down
      - alert: APIDown
        expr: up{job="returniq_backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ReturnIQ API is DOWN"
          description: "The backend API has been unreachable for more than 1 minute."

      # High error rate
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{job="returniq_backend", status=~"5.."}[5m])
          / rate(http_requests_total{job="returniq_backend"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate (>5%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # Slow API response
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="returniq_backend"}[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 API response time > 2s"
          description: "95th percentile response time is {{ $value }}s."

      # ML inference slow
      - alert: SlowMLInference
        expr: returniq_ml_inference_latency_ms_p95 > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML inference P95 > 500ms"
          description: "XGBoost predictions are taking too long."

  - name: returniq_database
    rules:

      # Postgres down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"

      # High connection count
      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80"
          description: "Current connections: {{ $value }}. Max is 100."

      # Disk filling up
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space < 20% free"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk space CRITICAL — < 10% free"

  - name: returniq_redis
    rules:

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN — rate limiting non-functional"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 85% of limit"

  - name: returniq_security
    rules:

      # Spike in failed logins (potential brute force)
      - alert: LoginFailureSpike
        expr: increase(returniq_login_failures_total[5m]) > 20
        labels:
          severity: warning
        annotations:
          summary: "Login failure spike — possible brute force"
          description: "{{ $value }} failed logins in the last 5 minutes."

      # Unusual volume of data exports
      - alert: UnusualExportVolume
        expr: increase(returniq_data_exports_total[1h]) > 10
        labels:
          severity: warning
        annotations:
          summary: "High number of data exports ({{ $value }} in 1h)"
