# ReturnIQ Enterprise — CI/CD Pipeline
# Triggers: push to any branch + pull requests to main/develop
# Full pipeline on main: test → security → build → deploy staging → approval → deploy prod

name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  # ── 1. Backend Lint & Tests ─────────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: returniq_test
          POSTGRES_USER: returniq
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff (correctness codes are a hard gate)
        run: |
          cd backend
          # F = pyflakes correctness (undefined names, unused imports,
          # redefinitions), E9 = syntax errors. These are bugs, not style.
          ruff check app/ ml/ --select F,E9
        continue-on-error: false

      - name: Lint with ruff (full ruleset, advisory)
        run: |
          cd backend
          ruff check app/ ml/ || true

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg2://returniq:testpassword@localhost:5432/returniq_test
          SECRET_KEY: ci-test-secret-key-not-real-64chars-padded-to-length-minimum
          API_KEY_HASH_PEPPER: ci-test-pepper-not-real-64chars-padded-to-length-minimum1
        run: |
          cd backend
          alembic upgrade head

      - name: Security tests (RELEASE BLOCKER - must be 100%)
        env:
          DATABASE_URL: postgresql+psycopg2://returniq:testpassword@localhost:5432/returniq_test
          SECRET_KEY: ci-test-secret-key-not-real-64chars-padded-to-length-minimum
          API_KEY_HASH_PEPPER: ci-test-pepper-not-real-64chars-padded-to-length-minimum1
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/security/ -v
        # No continue-on-error. A failure here is an exploitable vulnerability,
        # not a flaky test - the build must stop.

      - name: Tenant isolation (RELEASE BLOCKER - Phase 4)
        env:
          DATABASE_URL: postgresql+psycopg2://returniq:testpassword@localhost:5432/returniq_test
          SECRET_KEY: ci-test-secret-key-not-real-64chars-padded-to-length-minimum
          API_KEY_HASH_PEPPER: ci-test-pepper-not-real-64chars-padded-to-length-minimum1
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/security/test_tenant_isolation.py -v
        # Called out as its own step, even though the step above already
        # covers tests/security/, because a cross-tenant leak is the single
        # worst failure mode a multi-tenant SaaS has: one merchant reading
        # another merchant's customers, fraud scores and evidence photos.
        # A named step means the failure is unmissable in the checks list
        # rather than buried in a 300-test summary.

      - name: Run full suite with coverage gate
        env:
          DATABASE_URL: postgresql+psycopg2://returniq:testpassword@localhost:5432/returniq_test
          SECRET_KEY: ci-test-secret-key-not-real-64chars-padded-to-length-minimum
          API_KEY_HASH_PEPPER: ci-test-pepper-not-real-64chars-padded-to-length-minimum1
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=75
        # Gate is 75% (current measured level). Raise to 85% once the frontend
        # suite lands - see qa/strategy/TEST_STRATEGY.md.

      - name: Bandit security static analysis (zero high/medium)
        run: |
          cd backend
          pip install bandit
          bandit -r app/ ml/ -ll -ii

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  # ── 2. Frontend Lint & Build ────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --frozen-lockfile

      - name: Unit & component tests (Vitest)
        run: cd frontend && npm test
        # PHASE 10: before this, 5,887 lines of frontend had zero automated
        # verification, and the build passing only proved the code parsed.
        # No continue-on-error: a failing component test means a broken
        # screen, and the returns console is what warehouse staff use to
        # decide whether a refund goes out.

      - name: Accessibility (RELEASE BLOCKER - Phase 48)
        run: cd frontend && npx vitest run src/test/accessibility.test.jsx
        # A named, separate gate rather than being folded into the run above,
        # for the same reason Phase 4's tenant-isolation check is named: when
        # this fails it must be obvious WHAT failed from the checks list, not
        # buried in a 75-test summary.
        #
        # These are not stylistic preferences. The defect that prompted this
        # gate was DataTable rows being mouse-only -- a keyboard user could
        # not open a return at all. That is a functional lockout, and a
        # regression here locks people out of the product again silently.

      - name: Build
        run: cd frontend && npm run build

      - name: Check build size
        run: |
          du -sh frontend/dist/
          # Fail if bundle > 5MB
          size=$(du -sb frontend/dist/ | cut -f1)
          if [ $size -gt 5242880 ]; then
            echo "Bundle too large: ${size} bytes (limit: 5MB)"
            exit 1
          fi

  # ── 3. Security Scan ────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety & bandit
        run: pip install safety bandit

      - name: Python dependency vulnerability scan (safety)
        run: |
          cd backend
          safety check -r requirements.txt --full-report || true
        # "|| true" — report but don't fail CI for transitive dep issues.
        # Change to fail (remove || true) once you have a clean baseline.

      - name: Python static security analysis (bandit)
        run: |
          cd backend
          bandit -r app/ -ll -ii --exclude app/tests
        # -ll: medium+ severity, -ii: medium+ confidence

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true

  # ── 4. Build & Push Docker Images ──────────────────────────────────────────
  docker-build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/returniq
            git pull origin develop
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            echo "Staging deployment complete"

      - name: Run smoke test on staging
        run: |
          sleep 15
          curl -f https://staging.YOUR_DOMAIN/health || exit 1
          echo "Staging smoke test passed"

  # ── 6. Deploy to Production (manual approval required) ─────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production   # requires manual approval in GitHub Environments settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/returniq

            # Pre-deployment backup
            bash infra/scripts/backup_db.sh

            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "Production deployment complete"

      - name: Run production smoke test
        run: |
          sleep 20
          curl -f https://YOUR_DOMAIN/health || exit 1
          echo "Production smoke test passed"

      - name: Tag release
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          VERSION=$(date +%Y.%m.%d)-${GITHUB_SHA::7}
          git tag "v${VERSION}"
          git push origin "v${VERSION}"